<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="logo.png" id="logo">
    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DKB000000L1Gv" method="POST">
 
        <input type=hidden name="oid" value="00DKB000000L1Gv">
        <input type=hidden name="retURL" value="http://siow.nl">
         
        <!--  ----------------------------------------------------------------------  -->
        <!--  OPMERKING: deze velden zijn optionele foutopsporingselementen.          -->
        <!--  Verwijder de aanduiding voor commentaarregels als u wilt testen in de   -->
        <!--  foutopsporingsmodus.                                                    -->
        <!--  <input type="hidden" name="debug" value=1>                              -->
        <!--  <input type="hidden" name="debugEmail" value="jveer@crmsolver.com">     -->
        <!--  ----------------------------------------------------------------------  -->
         
        <label for="first_name">Voornaam</label><input  id="first_name" maxlength="40" name="first_name" size="20" type="text" /><br>
         
        <label for="last_name">Achternaam</label><input  id="last_name" maxlength="80" name="last_name" size="20" type="text" /><br>
         
        <label for="email">E-mail</label><input  id="email" maxlength="80" name="email" size="20" type="text" /><br>
         
        <label for="company">Bedrijf</label><input  id="company" maxlength="40" name="company" size="20" type="text" /><br>
         
        <label for="city">Plaats</label><input  id="city" maxlength="40" name="city" size="20" type="text" /><br>
         
        <label for="state">Staat/provincie</label><input  id="state" maxlength="20" name="state" size="20" type="text" /><br>
         
        <label for="description">Beschrijving</label><textarea name="description"></textarea><br>
         
        <label for="revenue">Jaaromzet</label><input  id="revenue" name="revenue" size="20" type="text" /><br>
         
        <input type="submit" name="submit">
         
        </form>  


        <style>

            form {
                        background: white;
                        padding: 20px;
                        border-radius: 10px;
                        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
                        border: 3px solid #007BFF;
                        width: 340px;
                        text-align: center;
                    }
            
            
                    body {
                        font-family: Arial, sans-serif;
                        background-color: #f4f4f4;
                        display: flex;
                        justify-content: center;
                        align-items: center;
                        height: 100vh;
                        margin: 0;
                        position: relative;
                    }
                    label {
                        display: block;
                        margin-top: 10px;
                        font-weight: bold;
                    }
                    input, textarea {
                        width: 100%;
                        padding: 8px;
                        margin-top: 5px;
                        border: 1px solid #ccc;
                        border-radius: 5px;
                    }
                    textarea {
                        height: 80px;
                    }
            
            
                    .submit-btn {
                        background-color: #007BFF;
                        color: white;
                        padding: 10px;
                        border: none;
                        border-radius: 5px;
                        cursor: pointer;
                        margin-top: 15px;
                        font-size: 16px;
                    }
                    .submit-btn:hover {
                        background-color: #0056b3;
                    }
                    #logo {
                        position: absolute;
                        top: 10px;
                        left: 10px;
                        width: 100px;
                    }
            </style>
</body>
</html>
