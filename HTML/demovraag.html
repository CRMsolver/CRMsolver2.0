<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <img src="logo.png" id="logo" alt="Logo">
    <form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DKB000000L1Gv" method="POST">
 
        <input type=hidden name="orgid" value="00DKB000000L1Gv">
        <input type=hidden name="retURL" value="https://www.siow.nl">
         
        <!--  ----------------------------------------------------------------------  -->
        <!--  OPMERKING: deze velden zijn optionele foutopsporingselementen.          -->

        <label for="name">Contactpersoonsnaam</label><input  id="name" maxlength="80" name="name" size="20" type="text" /><br>

</body>
<style>

form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            border: 3px solid #007BFF;
            width: 340px;
            text-align: center;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea {
            height: 80px;
        }


        .submit-btn {
            background-color: #007BFF;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #0056b3;
        }
        #logo {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 100px;
        }
</style>
